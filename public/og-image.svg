<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Varun Malhotra — Data Scientist, Generative AI &amp; LLM Engineer">
  <title>Varun Malhotra — Data Scientist, Generative AI &amp; LLM Engineer</title>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#DADFD8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#EEF0EC"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- top rule + eyebrow -->
  <rect x="72" y="72" width="1056" height="2" fill="#12161B"/>
  <text x="72" y="60" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" letter-spacing="2" fill="#2453D9">FIG. 0 &#8212; PORTFOLIO SUMMARY</text>

  <!-- name + role -->
  <text x="72" y="168" font-family="'Space Grotesk', 'Arial', sans-serif" font-weight="700" font-size="58" fill="#12161B">Varun Malhotra</text>
  <text x="72" y="210" font-family="'Space Grotesk', 'Arial', sans-serif" font-weight="400" font-size="26" fill="#454E57">Data Scientist &#183; Generative AI &amp; LLM Engineer</text>

  <text x="72" y="252" font-family="'Source Sans 3', 'Arial', sans-serif" font-size="20" fill="#454E57">
    <tspan x="72" dy="0">I build LLM systems that go to production and stay there &#8212;</tspan>
    <tspan x="72" dy="28">agent architectures, evaluation stacks, and guardrails that keep them honest.</tspan>
  </text>

  <!-- bottom rule -->
  <rect x="72" y="330" width="1056" height="1" fill="#C7CDC2"/>

  <!-- three metrics -->
  <g font-family="'Space Grotesk', 'Arial', sans-serif">
    <!-- metric 1 -->
    <text x="72" y="410" font-weight="700" font-size="64" fill="#12161B">50+</text>
    <text x="72" y="440" font-family="'Source Sans 3', 'Arial', sans-serif" font-size="18" fill="#12161B">Analysts served</text>
    <text x="72" y="466" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#2453D9">Basis &#8212; US and Europe, daily</text>

    <!-- metric 2 -->
    <text x="452" y="410" font-weight="700" font-size="64" fill="#12161B">95%</text>
    <text x="452" y="440" font-family="'Source Sans 3', 'Arial', sans-serif" font-size="18" fill="#12161B">Accuracy</text>
    <text x="452" y="466" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#2453D9">Basis &#8212; 500-question benchmark</text>

    <!-- metric 3 -->
    <text x="832" y="410" font-weight="700" font-size="64" fill="#12161B">27/wk</text>
    <text x="832" y="440" font-family="'Source Sans 3', 'Arial', sans-serif" font-size="18" fill="#12161B">Analyst-hours saved</text>
    <text x="832" y="466" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#2453D9">Basis &#8212; stakeholder-reported</text>
  </g>

  <!-- divider ticks under each metric column -->
  <rect x="72" y="486" width="340" height="3" fill="#2453D9"/>
  <rect x="452" y="486" width="340" height="3" fill="#2453D9"/>
  <rect x="832" y="486" width="296" height="3" fill="#2453D9"/>

  <!-- footer -->
  <rect x="72" y="558" width="1056" height="1" fill="#C7CDC2"/>
  <text x="72" y="592" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#454E57">michelin &#8212; pune, india</text>
  <text x="1128" y="592" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="15" fill="#454E57" text-anchor="end">varun-malhotra.pages.dev</text>
</svg>
